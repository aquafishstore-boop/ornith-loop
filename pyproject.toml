[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ornith-loop"
version = "0.1.0"
description = "Inference-time learning loop for Ollama coding models (skill bank + sandbox agent)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ornith-loop contributors" }]
keywords = ["ollama", "agents", "learning-loop", "ornith", "skill-bank"]
dependencies = [
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/aquafishstore-boop/ornith-loop"
Issues = "https://github.com/aquafishstore-boop/ornith-loop/issues"

[project.scripts]
ornith-loop = "ornith_loop.__main__:main"

[tool.setuptools.packages.find]
include = ["ornith_loop*"]
